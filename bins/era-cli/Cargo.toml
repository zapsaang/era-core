[package]
name = "era-cli"
description = "ERA — Encrypted Redundant Archiver CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "era"
path = "src/main.rs"

[dependencies]
era-common = { workspace = true }
era-crypto = { workspace = true }
era-engine = { workspace = true }
clap = { workspace = true, features = ["derive"] }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dialoguer = { workspace = true }
indicatif = { workspace = true }
walkdir = "2.5.0"
toml.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
rand = { workspace = true }
hex = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1.4"
tempfile = { workspace = true }
era-crypto = { workspace = true }
era-storage = { workspace = true }
era-volume = { workspace = true }
