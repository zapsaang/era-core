[package]
name = "era-cli"
description = "ERA — Encrypted Redundant Archiver CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "era"
path = "src/main.rs"

[dependencies]
era-common = { workspace = true }
era-crypto = { workspace = true }
era-engine = { workspace = true }
clap = { workspace = true, features = ["derive"] }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dialoguer = { workspace = true }
indicatif = "0.17"
walkdir = "2.5.0"
toml.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
rand = { workspace = true }
hex = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
tempfile = { workspace = true }
era-storage = { workspace = true }
era-volume = { workspace = true }
