[workspace]
resolver = "2"
members = [
    "crates/era-common",
    "crates/era-crypto",
    "crates/era-codec",
    "crates/era-storage",
    "crates/era-volume",
    "crates/era-packing",
    "crates/era-ingest",
    "crates/era-engine",
    "bins/era-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["ERA Team"]
repository = "https://github.com/zapsaang/era-core"

[workspace.dependencies]
# Internal crates
era-common = { path = "crates/era-common" }
era-crypto = { path = "crates/era-crypto" }
era-codec = { path = "crates/era-codec" }
era-storage = { path = "crates/era-storage" }
era-volume = { path = "crates/era-volume" }
era-packing = { path = "crates/era-packing" }
era-ingest = { path = "crates/era-ingest" }
era-engine = { path = "crates/era-engine" }

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Crypto
chacha20poly1305 = "0.10"
argon2 = "0.5"
blake3 = "1.5"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
subtle = "2.5"

# Compression
zstd = "0.13"
lz4_flex = "0.11"

# Erasure coding
reed-solomon-simd = "3.0"

# CRC32 for shard integrity
crc32fast = "1.4"

# SmallVec for stack-allocated vectors (performance optimization)
smallvec = { version = "1.13", features = ["union", "const_generics"] }

# UUID
uuid = { version = "1.6", features = ["v4", "serde"] }

# Bytes
bytes = "1.5"

# CLI
clap = { version = "4.4", features = ["derive"] }
indicatif = "0.17"
colored = "2.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Testing
tempfile = "3.9"
criterion = "0.5"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
