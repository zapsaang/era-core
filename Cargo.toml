[workspace]
resolver = "2"
members = [
    "crates/era-common",
    "crates/era-crypto",
    "crates/era-codec",
    "crates/era-storage",
    "crates/era-volume",
    "crates/era-packing",
    "crates/era-ingest",
    "crates/era-index",
    "crates/era-engine",
    "bins/era-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["ERA Team"]
repository = "https://github.com/zapsaang/era-core"

[workspace.dependencies]
# Internal crates
era-common = { path = "crates/era-common" }
era-crypto = { path = "crates/era-crypto" }
era-codec = { path = "crates/era-codec" }
era-storage = { path = "crates/era-storage" }
era-volume = { path = "crates/era-volume" }
era-packing = { path = "crates/era-packing" }
era-ingest = { path = "crates/era-ingest" }
era-index = { path = "crates/era-index" }
era-engine = { path = "crates/era-engine" }

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = { version = "2.0.0-rc.3", features = ["serde"] }
prost = "0.14.3"

# Crypto
chacha20poly1305 = "0.10"
argon2 = "0.5"
blake3 = "1.5"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
subtle = "2.5"
x25519-dalek = "2.0"

# Post-Quantum Cryptography (Kyber-768)
pqcrypto-mlkem = "0.1.1"
pqcrypto-traits = "0.3"

# Compression
zstd = "0.13"
lz4_flex = "0.11"

# Erasure coding
reed-solomon-simd = "3.0"

# CRC32 for shard integrity
crc32fast = "1.4"

# SmallVec for stack-allocated vectors (performance optimization)
smallvec = { version = "1.13", features = ["union", "const_generics"] }

# UUID
uuid = { version = "1.6", features = ["v4", "serde"] }

# Bytes
bytes = "1.5"

# Hex encoding/decoding
hex = "0.4"

# Concurrency primitives (faster than std::sync)
parking_lot = "0.12"

# Content-defined chunking (FastCDC)
fastcdc = "3.2"

# Zero-copy serialization
bytemuck = { version = "1.14", features = ["derive"] }
rkyv = { version = "0.7", default-features = false, features = ["validation", "size_64", "std"] }
async-trait = "0.1"

# Secure memory handling
zeroize = { version = "1.7", features = ["alloc"] }

# PEM format support
pem = "3.0"

# CLI
clap = { version = "4.4", features = ["derive"] }
indicatif = { version = "0.17", features = ["rayon"] }
colored = "2.1"
dialoguer = "0.11"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Time handling
time = { version = "0.3", features = ["serde"] }

# Data validation
garde = { version = "0.4", features = ["derive"] }

# Metrics and observability
metrics = "0.21"

# Configuration
toml = "0.8"

# Testing
tempfile = "3.9"
criterion = "0.5"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
