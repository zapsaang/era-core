name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init env
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          echo 'DPkg::Post-Invoke { "rm -f /var/lib/dpkg/triggers/* 2>/dev/null || true"; };' \
            | sudo tee /etc/apt/apt.conf.d/99no-triggers > /dev/null
          echo 'DPkg::TriggersPending "false";' \
            | sudo tee -a /etc/apt/apt.conf.d/99no-triggers > /dev/null

          sudo -E apt-get -qq update

          sudo -E apt-get install -y --no-install-recommends \
            build-essential \
            protobuf-compiler \
            libacl1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt (check)
        run: cargo fmt --all -- --check

      - name: cargo clippy (-D warnings, --locked)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test-era-cli:
    name: test-era-cli
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init env
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          echo 'DPkg::Post-Invoke { "rm -f /var/lib/dpkg/triggers/* 2>/dev/null || true"; };' \
            | sudo tee /etc/apt/apt.conf.d/99no-triggers > /dev/null
          echo 'DPkg::TriggersPending "false";' \
            | sudo tee -a /etc/apt/apt.conf.d/99no-triggers > /dev/null

          sudo -E apt-get -qq update

          sudo -E apt-get install -y --no-install-recommends \
            build-essential \
            protobuf-compiler \
            libacl1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo test -p era-cli (release, --locked, ulimit -n 1024)
        run: |
          # GitHub Actions runners default to a 1024 open-file limit. Pin it so
          # FD-exhaustion regressions fail here exactly as they do locally.
          ulimit -n 1024
          ulimit -n
          cargo test --release --locked -p era-cli

  test-workspace:
    name: test-workspace
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init env
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          echo 'DPkg::Post-Invoke { "rm -f /var/lib/dpkg/triggers/* 2>/dev/null || true"; };' \
            | sudo tee /etc/apt/apt.conf.d/99no-triggers > /dev/null
          echo 'DPkg::TriggersPending "false";' \
            | sudo tee -a /etc/apt/apt.conf.d/99no-triggers > /dev/null

          sudo -E apt-get -qq update

          sudo -E apt-get install -y --no-install-recommends \
            build-essential \
            protobuf-compiler \
            libacl1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo test --workspace (release, --locked, ulimit -n 1024)
        env:
          RUST_BACKTRACE: 1
        run: |
          ulimit -n 1024
          ulimit -n
          cargo test --release --locked --workspace
