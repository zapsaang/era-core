# NOTE: The `fuzz/` workspace is not yet present in this repository.
# Scheduled triggers are disabled until the workspace lands; run manually via workflow_dispatch.
name: fuzz

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Fuzz profile"
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - deep

permissions:
  contents: read

jobs:
  fuzz-smoke:
    name: fuzz-smoke
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.profile == 'smoke' }}

    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_footer_parse
          - fuzz_super_header_structured

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check fuzz workspace availability
        id: fuzz_check
        run: |
          if [ ! -f fuzz/Cargo.toml ]; then
            echo "Fuzz workspace (fuzz/) is not present in this checkout; skipping fuzz-smoke."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Init env
        if: steps.fuzz_check.outputs.present == 'true'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          echo 'DPkg::Post-Invoke { "rm -f /var/lib/dpkg/triggers/* 2>/dev/null || true"; };' \
            | sudo tee /etc/apt/apt.conf.d/99no-triggers > /dev/null
          echo 'DPkg::TriggersPending "false";' \
            | sudo tee -a /etc/apt/apt.conf.d/99no-triggers > /dev/null

          sudo -E apt-get -qq update

          sudo -E apt-get install -y --no-install-recommends \
            build-essential \
            protobuf-compiler \
            libacl1-dev

      - name: Install Rust nightly
        if: steps.fuzz_check.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        if: steps.fuzz_check.outputs.present == 'true'
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-fuzz
        if: steps.fuzz_check.outputs.present == 'true'
        run: cargo install cargo-fuzz --locked

      - name: Run fuzz smoke targets
        if: steps.fuzz_check.outputs.present == 'true'
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=60
        working-directory: fuzz
        timeout-minutes: 8

      - name: Upload fuzz artifacts
        if: always() && steps.fuzz_check.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-smoke-artifacts
          path: |
            fuzz/artifacts/**
            fuzz/corpus/**/crash-*
            fuzz/corpus/**/leak-*
            fuzz/corpus/**/oom-*
            fuzz/corpus/**/timeout-*
          if-no-files-found: ignore

  fuzz-deep:
    name: fuzz-deep
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.profile == 'deep' }}

    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_footer_parse
          - fuzz_block_header_parse
          - fuzz_super_header_parse
          - fuzz_super_header_structured
          - fuzz_footer_roundtrip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check fuzz workspace availability
        id: fuzz_check
        run: |
          if [ ! -f fuzz/Cargo.toml ]; then
            echo "Fuzz workspace (fuzz/) is not present in this checkout; skipping fuzz-deep."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Init env
        if: steps.fuzz_check.outputs.present == 'true'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          echo 'DPkg::Post-Invoke { "rm -f /var/lib/dpkg/triggers/* 2>/dev/null || true"; };' \
            | sudo tee /etc/apt/apt.conf.d/99no-triggers > /dev/null
          echo 'DPkg::TriggersPending "false";' \
            | sudo tee -a /etc/apt/apt.conf.d/99no-triggers > /dev/null

          sudo -E apt-get -qq update

          sudo -E apt-get install -y --no-install-recommends \
            build-essential \
            protobuf-compiler \
            libacl1-dev

      - name: Install Rust nightly
        if: steps.fuzz_check.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        if: steps.fuzz_check.outputs.present == 'true'
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-fuzz
        if: steps.fuzz_check.outputs.present == 'true'
        run: cargo install cargo-fuzz --locked

      - name: Run deep fuzz target
        if: steps.fuzz_check.outputs.present == 'true'
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=300
        working-directory: fuzz
        timeout-minutes: 20

      - name: Upload fuzz artifacts
        if: always() && steps.fuzz_check.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-deep-artifacts-${{ matrix.target }}
          path: |
            fuzz/artifacts/**
            fuzz/corpus/**/crash-*
            fuzz/corpus/**/leak-*
            fuzz/corpus/**/oom-*
            fuzz/corpus/**/timeout-*
          if-no-files-found: ignore
