syntax = "proto3";

package era.common;

message ArchiveConfig {
  CompressionConfig compression = 1;
  EncryptionConfig encryption = 2;
  VolumeConfig volume = 3;
  BlockConfig block = 4;
  optional ErasureCodeConfig erasure = 5;
  optional MatrixDistributionConfig distribution = 6;
  optional ChunkingConfig chunking = 7;
  optional PackingConfig packing = 8;
}

message MatrixDistributionConfig {
  enum Strategy {
    STRATEGY_ROTATING_OFFSET = 0;
  }
  Strategy strategy = 1;
}

message CompressionConfig {
  enum Algorithm {
    ALGORITHM_NONE = 0;
    ALGORITHM_ZSTD = 1;
    ALGORITHM_LZ4 = 2;
  }
  Algorithm algorithm = 1;
  int32 level = 2;
}

message EncryptionConfig {
  enum Algorithm {
    ALGORITHM_NONE = 0;
    ALGORITHM_XCHACHA20POLY1305 = 1;
  }
  Algorithm algorithm = 1;
  uint32 kdf_memory_cost = 2;
  uint32 kdf_time_cost = 3;
}

message VolumeConfig {
  uint64 max_size = 1;
  bool enable_padding = 2;
  string naming_template = 3;
}

message BlockConfig {
  uint32 target_size = 1;
}

message ErasureCodeConfig {
  uint32 data_shards = 1;
  uint32 parity_shards = 2;
}

message BlockLocation {
  bytes volume_id = 1;
  uint32 slot_index = 2;
  uint64 physical_offset = 3;
  uint32 encrypted_size = 4;
  optional ErasureBlockInfo erasure_info = 5;
  repeated uint64 shard_offsets = 6;
  repeated uint32 shard_volumes = 7;
}

message ErasureBlockInfo {
  uint32 data_shards = 1;
  uint32 parity_shards = 2;
  uint32 shard_size = 3;
  uint32 original_len = 4;
}

message ChunkingConfig {
  uint32 min_size = 1;
  uint32 avg_size = 2;
  uint32 max_size = 3;
  enum NormalizationLevel {
    NORMALIZATION_LEVEL_0 = 0;
    NORMALIZATION_LEVEL_1 = 1;
    NORMALIZATION_LEVEL_2 = 2;
    NORMALIZATION_LEVEL_3 = 3;
  }
  NormalizationLevel normalization_level = 4;
  uint64 rolling_hash_seed = 5;
}

message PackingConfig {
  uint32 k_factor = 1;
  uint32 flush_threshold = 2;
}

message ChunkHash {
  bytes hash = 1;
}

enum KeyWrapAlgorithm {
  KEY_WRAP_ALGORITHM_XCHACHA20_POLY1305 = 0;
}

message EncryptedVolumeKey {
  KeyWrapAlgorithm algorithm = 1;
  bytes nonce = 2;
  bytes ciphertext = 3;
}

enum AccessPolicy {
  ACCESS_POLICY_ANY_OF_N = 0;
  ACCESS_POLICY_THRESHOLD = 1;
}

message SuperHeader {
  bytes magic = 1;
  uint32 version = 2;
  bytes volume_id = 3;
  bytes archive_id = 4;
  uint32 volume_sequence = 5;
  uint32 total_volumes = 6;
  int64 creation_time = 7;
  uint64 feature_flags = 8;
  repeated RecipientSlot recipients = 9;
  ArchiveConfig config = 10;
  bytes salt = 11;
  uint32 epoch_id = 12;
  EncryptedVolumeKey encrypted_volume_key = 13;
  AccessPolicy access_policy = 14;
  uint32 threshold = 15;
}

message RecipientSlot {
  enum RecipientType {
    RECIPIENT_TYPE_ARGON2ID_PASSWORD = 0;
    RECIPIENT_TYPE_X25519_PUBKEY = 1;
    RECIPIENT_TYPE_FIDO2_HMAC = 2;
    RECIPIENT_TYPE_HYBRID_KEM = 3;
  }
  RecipientType type = 1;
  bytes key_id = 2;
  bytes params = 3;
  bytes encrypted_master_key = 4;
}

message Footer {
  bytes magic = 1;
  uint32 flags = 2;
  uint64 data_end_offset = 3;
  uint32 block_count = 4;
  uint64 sequence_number = 5;
  uint64 catalog_offset = 6;
  uint32 catalog_size = 7;
  uint32 catalog_block_id = 8;
  uint64 last_checkpoint_offset = 9;
  uint32 last_checkpoint_block_id = 10;
  bytes checksum = 11;
  uint64 index_offset = 12;
  uint32 index_size = 13;
  uint32 index_block_id = 14;
  uint64 backup_header_offset = 15;
}

enum CompactRegionKind {
  COMPACT_REGION_KIND_STRIPED_DATA = 0;
  COMPACT_REGION_KIND_REPLICATED_TYPED_BLOCK = 1;
}

message CompactDirectoryEntry {
  uint64 block_id = 1;
  uint32 block_type = 2;
  CompactRegionKind region_kind = 3;
  uint64 offset = 4;
  uint64 span = 5;
  uint32 stripe_ordinal = 6;
}

message CompactShardRecordHeader {
  uint32 record_version = 1;
  uint64 block_id = 2;
  uint32 stripe_ordinal = 3;
  uint32 shard_index = 4;
  uint32 data_shards = 5;
  uint32 parity_shards = 6;
  uint32 encrypted_len = 7;
  uint32 shard_len = 8;
  uint32 shard_crc = 9;
}

message CompactVolumeFooter {
  bytes magic = 1;
  uint32 version = 2;
  uint64 data_region_end = 3;
  uint64 meta_region_offset = 4;
  uint64 directory_offset = 5;
  uint32 directory_size = 6;
  uint32 directory_count = 7;
  uint64 catalog_offset = 8;
  uint32 catalog_size = 9;
  uint64 catalog_block_id = 10;
  uint64 index_offset = 11;
  uint32 index_size = 12;
  uint64 index_block_id = 13;
  bytes header_hash = 14;
  bytes directory_hash = 15;
  uint32 footer_checksum = 16;
}

message CompactSuperHeader {
  bytes magic = 1;
  uint32 version = 2;
  bytes compact_set_id = 3;
  bytes archive_id = 4;
  bytes volume_id = 5;
  uint32 volume_sequence = 6;
  uint32 total_compact_volumes = 7;
  uint32 source_format = 8;
  uint32 source_version = 9;
  uint32 source_volume_count = 10;
  ArchiveConfig config = 11;
  repeated RecipientSlot recipients = 12;
  AccessPolicy access_policy = 13;
  uint32 threshold = 14;
  bytes salt = 15;
  uint32 epoch_id = 16;
  EncryptedVolumeKey encrypted_volume_key = 17;
  uint64 distribution_strategy = 18;
  uint64 reserved_flags = 19;
}

message ChunkRef {
  ChunkHash hash = 1;
  uint64 offset = 2;
  uint32 length = 3;
  optional PackedChunkInfo packed_info = 4;
}

message PackedChunkInfo {
  uint32 file_index = 1;
  uint32 total_files = 2;
}

message FileEntry {
  enum FileType {
    FILE_TYPE_FILE = 0;
    FILE_TYPE_DIRECTORY = 1;
    FILE_TYPE_SYMLINK = 2;
  }

  string path = 1;
  FileType file_type = 2;
  uint64 size = 3;
  uint32 permissions = 4;
  optional uint64 mtime = 5;
  optional string symlink_target = 6;
  optional uint32 uid = 7;
  optional uint32 gid = 8;
  map<string, bytes> xattrs = 9;
  optional bytes acl = 10;
  repeated ChunkRef chunks = 11;
}

message Catalog {
  repeated FileEntry entries = 1;
  uint64 total_size = 2;
  uint64 file_count = 3;
  uint64 dir_count = 4;
  repeated BlockLocation block_locations = 5;
}

message ChunkIndexEntry {
  bytes hash = 1;
  uint32 offset = 2;
  uint32 length = 3;
}

message BlockChunkIndex {
  uint32 count = 1;
  repeated ChunkIndexEntry entries = 2;
}

message KeyEncapsulation {
  bytes ephemeral_public = 1;
  bytes encrypted_master_key = 2;
}

message InProgressFile {
  string path = 1;
  uint64 total_size = 2;
  uint64 bytes_processed = 3;
  uint32 chunks_written = 4;
}

message CheckpointEntry {
  bytes hash = 1;
  BlockLocation location = 2;
}

message Checkpoint {
  uint32 version = 1;
  uint64 timestamp = 2;
  string archive_path = 3;
  repeated string completed_files = 4;
  optional InProgressFile in_progress_file = 5;
  repeated CheckpointEntry written_chunks = 6;
  uint32 current_volume = 7;
  uint64 current_offset = 8;
  uint64 total_bytes_written = 9;
  uint32 total_files_processed = 10;
}

message EraCertificate {
  bytes public_key = 1;
  bytes key_id = 2;
  int64 created_at = 3;
  optional int64 expires_at = 4;
  optional string label = 5;
}

// ArchiveManifest: cryptographically authenticated global state snapshot (v8.2)
message ArchiveManifest {
  uint32 epoch_id = 1;
  uint64 finalize_sequence = 2;
  uint64 committed_horizon = 3;
  bytes catalog_commitment = 4; // exactly 32 bytes
  bytes index_commitment = 5; // exactly 32 bytes, or all zeros if no index
  // Per-volume committed end offsets sorted by volume sequence.
  // Validation rules enforced by ArchiveManifest::try_from:
  //   - Maximum 1024 entries (MAX_VOLUMES)
  //   - Each value must be >= 4224 (DATA_REGION_START = SuperHeader + BackupFooter)
  //     or exactly 0 (sentinel: volume exists but has no committed data yet)
  repeated uint64 volume_committed_ends = 6;
}
