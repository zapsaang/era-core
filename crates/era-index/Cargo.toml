[package]
name = "era-index"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Redb-backed chunk deduplication index for ERA archive system"

[dependencies]
# Internal crates
era-common = { path = "../era-common" }
era-crypto = { path = "../era-crypto" }
era-volume = { path = "../era-volume" }

# Embedded database (RFC-023 mandated)
redb = "2.1"

# Serialization
rkyv = { workspace = true }

# Bytes
bytes = "1.5"


# Logging
tracing = "0.1"

# Concurrency
parking_lot = "0.12"

# LRU cache for page_cache
lru = "0.12"

# Bloom filter
bloomfilter = "1.0"

# Temporary files (for Redb staging file)
tempfile = "3.10"

# Storage backend (needed for VolumeWriter trait bound)
era-storage = { path = "../era-storage" }

[dev-dependencies]
tempfile = "3.10"
criterion = "0.5"
rand = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[[bench]]
name = "index_bench"
harness = false
