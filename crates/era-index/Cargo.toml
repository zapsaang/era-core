[package]
name = "era-index"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "LSM-Tree based chunk deduplication index for ERA archive system"

[dependencies]
# Internal crates
era-common = { path = "../era-common" }
era-crypto = { path = "../era-crypto" }
era-volume = { path = "../era-volume" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
rkyv = { workspace = true }
rmp-serde = "1.3"

# Bytes
bytes = "1.5"

# Error handling
thiserror = "1.0"

# Logging
tracing = "0.1"

# Concurrency
parking_lot = "0.12"

# Bloom filter
bloomfilter = { version = "1.0", features = ["serde"] }

# Random number generation (for ephemeral keys)
rand = "0.8"

# Zeroization (for secure key handling)
zeroize = "1.7"

# Temporary files (for secure spilling)
tempfile = "3.10"

# Storage backend (needed for VolumeWriter trait bound)
era-storage = { path = "../era-storage" }

[dev-dependencies]
tempfile = "3.10"
criterion = "0.5"
rand = "0.8"

[[bench]]
name = "index_bench"
harness = false
