[package]
name = "era-index"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Redb-backed chunk deduplication index for ERA archive system"

[dependencies]
# Internal crates
era-common = { path = "../era-common" }
era-crypto = { path = "../era-crypto" }
era-volume = { path = "../era-volume" }

# Embedded database (RFC-023 mandated)
redb = "3.1.1"

# Serialization
rkyv = { workspace = true }
bytecheck = { workspace = true }

# Bytes
bytes = "1.5"


# Logging
tracing = "0.1"



# Bloom filter
bloomfilter = "3.0"

# Temporary files (for Redb staging file)
tempfile = { workspace = true }

# Storage backend (needed for VolumeWriter trait bound)
era-storage = { path = "../era-storage" }

[dev-dependencies]
tempfile = { workspace = true }
criterion = "0.8.2"
rand = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[[bench]]
name = "index_bench"
harness = false
