[package]
name = "era-index"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "LSM-Tree based chunk deduplication index for ERA archive system"

[dependencies]
# Internal crates
era-common = { path = "../era-common" }

# RocksDB - LSM-Tree implementation
rocksdb = "0.22"

# Serialization
bincode = { version = "2.0.0-rc.3", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }

# Bytes
bytes = "1.5"

# Error handling
thiserror = "1.0"

# Logging
tracing = "0.1"

# Concurrency
parking_lot = "0.12"

[dev-dependencies]
tempfile = "3.10"
criterion = "0.5"
rand = "0.8"

[[bench]]
name = "index_bench"
harness = false
