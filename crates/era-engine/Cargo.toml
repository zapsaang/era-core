[package]
name = "era-engine"
description = "Core engine for ERA archive system"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []

[dependencies]
era-common = { workspace = true }
era-crypto = { workspace = true }
era-codec = { workspace = true }
era-storage = { workspace = true }
era-volume = { workspace = true }
era-packing = { workspace = true }
era-ingest = { workspace = true }
era-index = { workspace = true }
futures = "0.3"

bytes = { workspace = true }
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "sync",
    "time",
    "macros",
] }
zstd = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
prost = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
blake3 = { workspace = true }
subtle = { workspace = true }
rand = { workspace = true }
parking_lot = { workspace = true }
hex = "0.4"
metrics = { workspace = true }
walkdir = "2.5.0"
bincode = { workspace = true }
rkyv = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }
rand = "0.8"

[[bench]]
name = "engine_bench"
harness = false

[[bench]]
name = "e2e_performance_bench"
harness = false

[[bench]]
name = "real_world_perf_test"
harness = false

[[bench]]
name = "batch_api_bench"
harness = false

[[bench]]
name = "small_file_packing_bench"
harness = false

[[bench]]
name = "chunk_index_bench"
harness = false
